<!DOCTYPE html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BlackPearl brings you curated tour deals and custom packages to the world's most amazing destinations." />
    <!-- The API origin, substituted at build time. The Pages Function reads it
         from here to annotate deal pages with live data, so the edge needs no
         separate copy of this URL to keep in step. -->
    <meta name="x-api-origin" content="%VITE_API_URL%" />
    <!-- The API-origin preconnect is injected by vite.config.ts when
         VITE_API_URL is defined, so a build without it stays valid HTML. -->
    <!-- The home hero and the deals grid cannot paint until the deals response
         arrives, and five of the six live deal titles are Bengali, which
         renders in the bold SolaimanLipi face. Start those downloads with the
         document instead of after React mounts: the app's own request reuses
         the cached response, and the face is ready before the title is laid
         out. Routes that show neither on their first screen skip the cost. -->
    <script>
      (function () {
        var path = window.location.pathname.replace(/\/+$/, '') || '/';
        var isHome = path === '/';
        if (!isHome && path !== '/deals') return;
        var head = document.head;
        var meta = document.querySelector('meta[name="x-api-origin"]');
        var origin = meta && meta.getAttribute('content');
        if (origin && /^https?:\/\//.test(origin)) {
          var deals = document.createElement('link');
          deals.rel = 'preload';
          deals.as = 'fetch';
          deals.crossOrigin = 'anonymous';
          deals.href = origin.replace(/\/$/, '') + '/deals';
          head.appendChild(deals);
        }
        if (!isHome) return;
        var face = document.createElement('link');
        face.rel = 'preload';
        face.as = 'font';
        face.type = 'font/woff2';
        face.crossOrigin = 'anonymous';
        face.href = '/fonts/solaimanlipi/SolaimanLipi_Bold_10-03-12.woff2';
        head.appendChild(face);
      })();
    </script>
    <!-- The hero's Inter and Bebas Neue faces are self-hosted (see index.css),
         so the document opens no third-party font connection. -->
    <title>BlackPearl | Curated Tour Deals & Custom Travel Packages</title>
  </head>
  <body>
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolved = (theme === 'dark' || theme === 'light') ? theme : (prefersDark ? 'dark' : 'light');
        var root = document.documentElement;
        root.classList.add(resolved);
        // OpenGlass's liquid tokens (--ogui-lg-*) only resolve under this
        // attribute. Setting it in the inline script, alongside the theme class,
        // means glass surfaces have their material from the first paint instead
        // of collapsing to transparent until the theme provider mounts.
        root.dataset.oguiDesign = 'liquid';
        root.dataset.oguiAppearance = resolved;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
