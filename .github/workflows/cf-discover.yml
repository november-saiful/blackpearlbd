name: CF Discover (temporary)
on:
  workflow_dispatch: {}
  push:
    branches:
      - global
    paths:
      - '.github/workflows/cf-discover.yml'
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Discover Cloudflare accounts, zones, Pages, Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          echo "=== ACCOUNTS ==="
          curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts?per_page=20" | head -c 2000; echo
          echo "=== ZONES (blackpearl.bd) ==="
          curl -s -H "$H" "https://api.cloudflare.com/client/v4/zones?name=blackpearl.bd" | head -c 2000; echo
          ACC=$(curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts?per_page=5" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result',[]); print(r[0]['id'] if r else '')")
          echo "ACCOUNT_ID=$ACC"
          if [ -n "$ACC" ]; then
            echo "=== PAGES PROJECTS ==="
            curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects?per_page=20" | python3 -c "import sys,json; d=json.load(sys.stdin); [print(p.get('name'), '|', p.get('domains')) for p in d.get('result',[])]"
            echo "=== WORKERS SCRIPTS ==="
            curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts?per_page=20" | head -c 2000; echo
          fi
