name: CF Attach global domains (temporary)
on:
  workflow_dispatch: {}
  push:
    branches:
      - global
    paths:
      - '.github/workflows/cf-attach-global.yml'
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Attach global.blackpearl.bd (Pages) + global-api.blackpearl.bd (Worker)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -x
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ACC="8cfdbf7a8b04a63f887ebdb4eaa033b1"
          ZONE="1a82f70e8fd5cacd0d029d67c4817ed2"
          echo "=== PAGES PROJECTS (raw) ==="
          curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects?per_page=20" | head -c 3000; echo
          echo "=== TRY PAGES CUSTOM DOMAIN global.blackpearl.bd on project blackpearlbd ==="
          curl -s -H "$H" -H "Content-Type: application/json" \
            -X POST "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/blackpearlbd/domains" \
            -d '{"name":"global.blackpearl.bd"}' | head -c 2000; echo
          echo "=== WORKERS SCRIPTS (raw) ==="
          curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts?per_page=20" | head -c 2000; echo
          echo "=== TRY WORKER CUSTOM DOMAIN global-api.blackpearl.bd on blackpearl-api-global ==="
          curl -s -H "$H" -H "Content-Type: application/json" \
            -X PUT "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/blackpearl-api-global/domains" \
            -d '{"hostname":"global-api.blackpearl.bd","service":"blackpearl-api-global","environment":"production"}' | head -c 2000; echo
          echo "=== DNS CNAME global (raw) ==="
          curl -s -H "$H" "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=global.blackpearl.bd" | head -c 2000; echo
          echo "DONE — check outputs above. Pages custom-domain failure usually means token lacks Pages scope: finish in dashboard (Workers & Pages → project → Custom domains)."
