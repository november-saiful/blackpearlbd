name: CF Attach global domains (temporary)
on:
  workflow_dispatch: {}
  push:
    branches:
      - global
    paths:
      - '.github/workflows/cf-attach-global.yml'
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Verify global.blackpearl.bd status and branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -x
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ACC="8cfdbf7a8b04a63f887ebdb4eaa033b1"
          echo "=== PAGES DOMAIN DETAILS ==="
          curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/blackpearlbd/domains/global.blackpearl.bd" | head -c 3000; echo
          echo "=== PAGES DEPLOYMENTS for branch global ==="
          curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/blackpearlbd/deployments?branch=global&per_page=5" | head -c 3000; echo
          echo "=== TRY PATCH DOMAIN to branch global ==="
          curl -s -H "$H" -H "Content-Type: application/json" \
            -X PATCH "https://api.cloudflare.com/client/v4/accounts/$ACC/pages/projects/blackpearlbd/domains/global.blackpearl.bd" \
            -d '{"branch":"global"}' | head -c 2000; echo
          echo "=== WORKER GLOBAL DOMAINS ==="
          curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/blackpearl-api-global/domains" | head -c 2000; echo
          echo "=== WORKER GLOBAL HEALTH ==="
          curl -s -m 20 -i https://blackpearl-api-global.ms-blackpearlbd.workers.dev/ | head -n 15; echo
          echo "DONE"
