name: Deploy Database Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --project-ref lichnzimdpnmofvigtfg

# Required repo secret: SUPABASE_ACCESS_TOKEN
# Get it from: https://supabase.com/dashboard/account/tokens
# Set in GitHub → Settings → Secrets and variables → Actions → New repository secret
